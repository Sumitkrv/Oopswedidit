<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F7F1DF"/>
    </linearGradient>
    <linearGradient id="coffee-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#532510"/>
      <stop offset="100%" stop-color="#38180A"/>
    </linearGradient>
    <linearGradient id="terracotta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C46F39"/>
      <stop offset="100%" stop-color="#DC9F7E"/>
    </linearGradient>
    <filter id="float-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="12" dy="24" stdDeviation="28" flood-color="#532510" flood-opacity="0.16"/>
    </filter>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="12" stdDeviation="12" flood-color="#532510" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow & Geometric Rings -->
  <circle cx="500" cy="450" r="380" fill="none" stroke="#E8B79A" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="500" cy="450" r="260" fill="none" stroke="#C46F39" stroke-width="1" opacity="0.3"/>

  <!-- Layer 1: Studio Monograph Base Card (Tilted 5deg) -->
  <g transform="translate(180, 140) rotate(-4)" filter="url(#float-shadow)">
    <rect x="0" y="0" width="560" height="420" rx="16" fill="url(#hero-paper)" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="560" height="36" rx="16" fill="#532510"/>
    <rect x="0" y="24" width="560" height="12" fill="#532510"/>
    <circle cx="28" cy="18" r="4.5" fill="#E8B79A"/>
    <circle cx="44" cy="18" r="4.5" fill="#C46F39"/>
    <circle cx="60" cy="18" r="4.5" fill="#FDF9EF"/>
    <text x="280" y="22" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">ATELIER ARCHIVE // MONOGRAPH 04</text>

    <!-- Content Inside Monograph -->
    <rect x="36" y="60" width="240" height="320" rx="8" fill="#532510"/>
    <!-- Arch inside Monograph -->
    <path d="M 76 380 V 160 A 80 80 0 0 1 236 160 V 380 Z" fill="#C46F39" opacity="0.9"/>
    <circle cx="156" cy="220" r="30" fill="#FDF9EF" opacity="0.95"/>
    <text x="156" y="227" fill="#532510" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="28" font-weight="700" text-anchor="middle">04</text>

    <!-- Monograph Text -->
    <text x="306" y="110" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="3">EDITORIAL DIRECTION</text>
    <text x="306" y="160" fill="#532510" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="40" font-weight="400">Tactile Modernism</text>
    <line x1="306" y1="184" x2="520" y2="184" stroke="#532510" stroke-opacity="0.15" stroke-width="1"/>
    
    <text x="306" y="220" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" opacity="0.75" width="200">
      Balancing brutalist structure with warm coffee tones and interactive grace.
    </text>

    <rect x="306" y="270" width="180" height="42" rx="21" fill="#C46F39"/>
    <text x="396" y="296" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Explore Case Study →</text>
  </g>

  <!-- Layer 2: Main Floating Studio Interface (Tilted 3deg opposite) -->
  <g transform="translate(320, 260) rotate(3)" filter="url(#float-shadow)">
    <rect x="0" y="0" width="580" height="440" rx="20" fill="#532510" stroke="#C46F39" stroke-width="2"/>
    
    <!-- Top Bar -->
    <rect x="24" y="24" width="532" height="48" rx="12" fill="#38180A"/>
    <text x="48" y="54" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">oopswedidit.</text>
    <text x="170" y="53" fill="#E8B79A" font-family="'Space Grotesk', sans-serif" font-size="11" letter-spacing="1">STUDIO INDEX 2026</text>

    <rect x="440" y="32" width="100" height="32" rx="16" fill="#C46F39"/>
    <text x="490" y="52" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">LIVE WORK</text>

    <!-- Main Visual Split inside -->
    <rect x="24" y="90" width="310" height="320" rx="12" fill="#FDF9EF"/>
    <text x="48" y="130" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="2">NEW RELEASES</text>
    <text x="48" y="174" fill="#532510" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="34">Digital Mastery</text>
    <text x="48" y="210" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.75">
      Crafting experiences that linger long after the tab is closed.
    </text>

    <!-- Interactive Toggle in Mockup -->
    <rect x="48" y="250" width="260" height="60" rx="10" fill="#F7F1DF"/>
    <circle cx="80" cy="280" r="18" fill="#C46F39"/>
    <text x="80" y="285" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">✓</text>
    <text x="115" y="278" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Production Ready</text>
    <text x="115" y="295" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.6">High performance web stack</text>

    <rect x="48" y="330" width="160" height="46" rx="23" fill="#532510"/>
    <text x="128" y="358" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Get in Touch →</text>

    <!-- Right Side Abstract Shapes inside Mockup -->
    <rect x="350" y="90" width="206" height="320" rx="12" fill="#38180A"/>
    <circle cx="453" cy="200" r="70" fill="url(#terracotta-grad)"/>
    <polygon points="453,130 520,250 386,250" fill="#532510" opacity="0.6"/>
    <!-- Terracotta Star Rays -->
    <g transform="translate(453, 200)">
      <line x1="0" y1="-85" x2="0" y2="-100" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="60" y1="-60" x2="72" y2="-72" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="85" y1="0" x2="100" y2="0" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="60" y1="60" x2="72" y2="72" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="85" x2="0" y2="100" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-60" y1="60" x2="-72" y2="72" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-85" y1="0" x2="-100" y2="0" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-60" y1="-60" x2="-72" y2="-72" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="453" y="340" fill="#E8B79A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">CREATIVE FIRST</text>
    <text x="453" y="365" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="10" opacity="0.6" letter-spacing="1" text-anchor="middle">NEXT-GEN EXPERIENCES</text>
  </g>

  <!-- Layer 3: Floating Terracotta Stamp / Badge (Sticker-like) -->
  <g transform="translate(240, 640) rotate(-10)" filter="url(#badge-shadow)">
    <circle cx="65" cy="65" r="65" fill="#C46F39" stroke="#FDF9EF" stroke-width="3"/>
    <!-- Stamp Starburst -->
    <circle cx="65" cy="65" r="52" fill="none" stroke="#FDF9EF" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="65" y="58" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">OOPS</text>
    <text x="65" y="76" fill="#FDF9EF" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="20" text-anchor="middle">we did it.</text>
  </g>

  <!-- Layer 4: Top Floating Pill Badge -->
  <g transform="translate(680, 100) rotate(8)" filter="url(#badge-shadow)">
    <rect x="-90" y="-22" width="180" height="44" rx="22" fill="#E8B79A" stroke="#532510" stroke-width="1.5"/>
    <text x="0" y="5" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">✦ BOUTIQUE STUDIO</text>
  </g>

  <!-- Handcrafted Terracotta Sunburst Rays Accent in bottom right -->
  <g transform="translate(860, 720)">
    <line x1="0" y1="-30" x2="0" y2="-48" stroke="#C46F39" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="22" y1="-22" x2="36" y2="-36" stroke="#C46F39" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="30" y1="0" x2="48" y2="0" stroke="#C46F39" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="36" y2="36" stroke="#C46F39" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="30" x2="0" y2="48" stroke="#C46F39" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-22" y1="22" x2="-36" y2="36" stroke="#C46F39" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-30" y1="0" x2="-48" y2="0" stroke="#C46F39" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-22" y1="-22" x2="-36" y2="-36" stroke="#C46F39" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>

