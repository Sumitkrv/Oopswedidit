<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF9EF"/>
      <stop offset="100%" stop-color="#F7F1DF"/>
    </linearGradient>
    <filter id="sc-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#532510" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sc-bg)"/>

  <g transform="translate(140, 100)" filter="url(#sc-sh)">
    <rect x="0" y="0" width="920" height="600" rx="16" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="920" height="46" rx="16" fill="#532510"/>
    <rect x="0" y="30" width="920" height="16" fill="#532510"/>
    <circle cx="28" cy="23" r="5" fill="#E8B79A"/>
    <circle cx="44" cy="23" r="5" fill="#C46F39"/>
    <circle cx="60" cy="23" r="5" fill="#FDF9EF" opacity="0.6"/>
    <text x="460" y="28" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2" text-anchor="middle">SAHYOGCARE4U.ORG // COMMUNITY HEALTHCARE &amp; SOCIAL IMPACT</text>

    <!-- Social Impact Showcase Display -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="460" height="480" rx="12" fill="#532510"/>
      <!-- Holding Hands & Tree of Life Silhouette -->
      <circle cx="230" cy="180" r="70" fill="#C46F39"/>
      <path d="M 230 180 C 230 140, 190 140, 190 170 C 190 200, 230 220, 230 220 C 230 220, 270 200, 270 170 C 270 140, 230 140, 230 180 Z" fill="#FDF9EF"/>

      <!-- Sunburst Rays of Hope -->
      <g transform="translate(230, 180)">
        <line x1="0" y1="-85" x2="0" y2="-100" stroke="#E8B79A" stroke-width="2.5"/>
        <line x1="60" y1="-60" x2="72" y2="-72" stroke="#E8B79A" stroke-width="2.5"/>
        <line x1="85" y1="0" x2="100" y2="0" stroke="#E8B79A" stroke-width="2.5"/>
        <line x1="-60" y1="-60" x2="-72" y2="-72" stroke="#E8B79A" stroke-width="2.5"/>
        <line x1="-85" y1="0" x2="-100" y2="0" stroke="#E8B79A" stroke-width="2.5"/>
      </g>

      <text x="50" y="340" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">SAHYOG CARE</text>
      <text x="50" y="375" fill="#E8B79A" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="24">Leading Change Across The Nation</text>
      <text x="50" y="410" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.8">
        Empowering vulnerable communities with healthcare, nutrition &amp; education.
      </text>

      <rect x="50" y="435" width="200" height="30" rx="15" fill="#C46F39"/>
      <text x="150" y="454" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Support Our Programs →</text>
    </g>

    <!-- Impact Metrics & Initiatives Column -->
    <g transform="translate(530, 80)">
      <rect x="0" y="0" width="350" height="480" rx="12" fill="#F7F1DF" stroke="#532510" stroke-width="1" stroke-opacity="0.15"/>
      <text x="24" y="38" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Community Impact Tracks</text>
      
      <rect x="24" y="60" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="90" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Mobile Health Clinics</text>
      <text x="40" y="110" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">120,000+ free consultations &amp; critical medicines</text>
      <text x="40" y="130" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Active in 45 Rural Districts</text>

      <rect x="24" y="160" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="190" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Child Nutrition &amp; Schooling</text>
      <text x="40" y="210" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Daily hot meals, digital classrooms &amp; books</text>
      <text x="40" y="230" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">35,000+ Children Enrolled</text>

      <rect x="24" y="260" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="290" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Women Livelihood Centers</text>
      <text x="40" y="310" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Vocational training, micro-credits &amp; craft sales</text>
      <text x="40" y="330" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Self-Reliance for 8,500+ Families</text>

      <rect x="24" y="370" width="302" height="50" rx="25" fill="#532510"/>
      <text x="175" y="401" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">View Verified Annual Report →</text>
    </g>
  </g>
</svg>

