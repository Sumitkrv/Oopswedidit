<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="mg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF9EF"/>
      <stop offset="100%" stop-color="#F7F1DF"/>
    </linearGradient>
    <filter id="mg-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#532510" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#mg-bg)"/>

  <g transform="translate(140, 100)" filter="url(#mg-sh)">
    <rect x="0" y="0" width="920" height="600" rx="16" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="920" height="46" rx="16" fill="#532510"/>
    <rect x="0" y="30" width="920" height="16" fill="#532510"/>
    <circle cx="28" cy="23" r="5" fill="#E8B79A"/>
    <circle cx="44" cy="23" r="5" fill="#C46F39"/>
    <circle cx="60" cy="23" r="5" fill="#FDF9EF" opacity="0.6"/>
    <text x="460" y="28" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2" text-anchor="middle">MAMAGIGGLES // MATERNAL &amp; PEDIATRIC HEALTHCARE</text>

    <!-- Warm Mother & Child Healthcare Display -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="460" height="480" rx="12" fill="#532510"/>
      <!-- Soft Arch & Heart Silhouette -->
      <path d="M 120 480 V 220 A 110 110 0 0 1 340 220 V 480 Z" fill="#38180A"/>
      <circle cx="230" cy="220" r="60" fill="#C46F39"/>
      
      <!-- Heart & Hugging Silhouette -->
      <path d="M 230 205 C 220 185, 190 190, 190 215 C 190 235, 230 255, 230 255 C 230 255, 270 235, 270 215 C 270 190, 240 185, 230 205 Z" fill="#FDF9EF"/>
      
      <!-- Gentle radiating rays -->
      <g transform="translate(230, 220)">
        <line x1="0" y1="-75" x2="0" y2="-90" stroke="#E8B79A" stroke-width="2"/>
        <line x1="53" y1="-53" x2="64" y2="-64" stroke="#E8B79A" stroke-width="2"/>
        <line x1="75" y1="0" x2="90" y2="0" stroke="#E8B79A" stroke-width="2"/>
        <line x1="-53" y1="-53" x2="-64" y2="-64" stroke="#E8B79A" stroke-width="2"/>
        <line x1="-75" y1="0" x2="-90" y2="0" stroke="#E8B79A" stroke-width="2"/>
      </g>

      <text x="50" y="340" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">MAMAGIGGLES</text>
      <text x="50" y="375" fill="#E8B79A" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="24">Joyful Maternal &amp; Baby Care</text>
      <text x="50" y="410" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.8">
        Compassionate obstetrics, postpartum counseling &amp; pediatric wellness clinics.
      </text>

      <rect x="50" y="435" width="190" height="30" rx="15" fill="#C46F39"/>
      <text x="145" y="454" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Book Pediatric Visit →</text>
    </g>

    <!-- Care Modules Column -->
    <g transform="translate(530, 80)">
      <rect x="0" y="0" width="350" height="480" rx="12" fill="#F7F1DF" stroke="#532510" stroke-width="1" stroke-opacity="0.15"/>
      <text x="24" y="38" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Holistic Care Spectrum</text>
      
      <rect x="24" y="60" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="90" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Prenatal &amp; Postnatal Support</text>
      <text x="40" y="110" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Certified lactation consultants &amp; pelvic wellness</text>
      <text x="40" y="130" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Gentle, Evidence-Based Guidance</text>

      <rect x="24" y="160" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="190" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Pediatric Developmental Milestones</text>
      <text x="40" y="210" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Immunizations, nutrition tracking &amp; growth checks</text>
      <text x="40" y="230" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Infant to Adolescence Care</text>

      <rect x="24" y="260" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="290" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Maternal Mental Health Circle</text>
      <text x="40" y="310" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Safe peer support groups and licensed therapists</text>
      <text x="40" y="330" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Zero Judgment Sanctuary</text>

      <rect x="24" y="370" width="302" height="50" rx="25" fill="#532510"/>
      <text x="175" y="401" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Find a Care Provider →</text>
    </g>
  </g>
</svg>

