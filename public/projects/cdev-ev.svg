<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cdev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF9EF"/>
      <stop offset="100%" stop-color="#F7F1DF"/>
    </linearGradient>
    <filter id="cdev-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#532510" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#cdev-bg)"/>

  <g transform="translate(140, 100)" filter="url(#cdev-sh)">
    <rect x="0" y="0" width="920" height="600" rx="16" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="920" height="46" rx="16" fill="#532510"/>
    <rect x="0" y="30" width="920" height="16" fill="#532510"/>
    <circle cx="28" cy="23" r="5" fill="#E8B79A"/>
    <circle cx="44" cy="23" r="5" fill="#C46F39"/>
    <circle cx="60" cy="23" r="5" fill="#FDF9EF" opacity="0.6"/>
    <text x="460" y="28" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2" text-anchor="middle">CDEVNEW.VERCEL.APP // NEXT-GEN ELECTRIC MOBILITY</text>

    <!-- EV Showcase Display -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="460" height="480" rx="12" fill="#532510"/>
      
      <!-- Electric Scooter Graphic Lines -->
      <g transform="translate(100, 110)">
        <!-- Wheels -->
        <circle cx="60" cy="160" r="32" fill="none" stroke="#C46F39" stroke-width="6"/>
        <circle cx="60" cy="160" r="14" fill="#E8B79A"/>
        <circle cx="240" cy="160" r="32" fill="none" stroke="#C46F39" stroke-width="6"/>
        <circle cx="240" cy="160" r="14" fill="#E8B79A"/>

        <!-- Chassis Frame & Stem -->
        <path d="M 60 160 L 140 160 L 220 70 L 235 40" fill="none" stroke="#FDF9EF" stroke-width="7" stroke-linecap="round"/>
        <line x1="210" y1="40" x2="250" y2="40" stroke="#C46F39" stroke-width="6" stroke-linecap="round"/>
        <path d="M 140 160 L 240 160" fill="none" stroke="#E8B79A" stroke-width="6"/>

        <!-- Lightning Spark -->
        <polygon points="175,90 165,115 180,115 170,140 195,105 180,105" fill="#C46F39"/>
      </g>

      <text x="50" y="340" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700">CDEV SCOOTERS</text>
      <text x="50" y="375" fill="#E8B79A" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="24">Zero Emissions. Infinite Thrill.</text>
      <text x="50" y="410" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.8">
        Smart IoT-connected urban electric vehicles with fast-swap battery tech.
      </text>

      <rect x="50" y="435" width="180" height="30" rx="15" fill="#C46F39"/>
      <text x="140" y="454" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Book a Test Ride →</text>
    </g>

    <!-- Telemetry & Performance Column -->
    <g transform="translate(530, 80)">
      <rect x="0" y="0" width="350" height="480" rx="12" fill="#F7F1DF" stroke="#532510" stroke-width="1" stroke-opacity="0.15"/>
      <text x="24" y="38" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Vehicle Performance Specs</text>
      
      <rect x="24" y="60" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="90" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">140 KM Range Per Charge</text>
      <text x="40" y="110" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Dual 3.2 kWh high-density LFP battery pack</text>
      <text x="40" y="130" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Fast 45-Min 0-80% Charging</text>

      <rect x="24" y="160" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="190" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Top Speed 85 km/h</text>
      <text x="40" y="210" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">6.0 kW peak high-torque permanent magnet motor</text>
      <text x="40" y="230" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">0 to 40 km/h in 3.1 Seconds</text>

      <rect x="24" y="260" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="290" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Smart Touchscreen Cluster &amp; App</text>
      <text x="40" y="310" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Turn-by-turn navigation, geofencing &amp; OTA updates</text>
      <text x="40" y="330" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Bluetooth &amp; LTE Connected</text>

      <rect x="24" y="370" width="302" height="50" rx="25" fill="#532510"/>
      <text x="175" y="401" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Pre-Order CDEV Velocity →</text>
    </g>
  </g>
</svg>

