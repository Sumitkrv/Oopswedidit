<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF9EF"/>
      <stop offset="100%" stop-color="#F7F1DF"/>
    </linearGradient>
    <filter id="pr-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#532510" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#pr-bg)"/>

  <g transform="translate(140, 100)" filter="url(#pr-sh)">
    <rect x="0" y="0" width="920" height="600" rx="16" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="920" height="46" rx="16" fill="#532510"/>
    <rect x="0" y="30" width="920" height="16" fill="#532510"/>
    <circle cx="28" cy="23" r="5" fill="#E8B79A"/>
    <circle cx="44" cy="23" r="5" fill="#C46F39"/>
    <circle cx="60" cy="23" r="5" fill="#FDF9EF" opacity="0.6"/>
    <text x="460" y="28" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2" text-anchor="middle">PRSPARKZ.COM // DIGITAL PR &amp; STRATEGIC COMMUNICATIONS</text>

    <!-- Editorial Press Layout -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="460" height="480" rx="12" fill="#532510"/>
      <!-- Sparkz Sunburst Emblem -->
      <g transform="translate(230, 100)">
        <circle cx="0" cy="0" r="32" fill="#C46F39"/>
        <line x1="0" y1="-44" x2="0" y2="-56" stroke="#E8B79A" stroke-width="3" stroke-linecap="round"/>
        <line x1="31" y1="-31" x2="40" y2="-40" stroke="#E8B79A" stroke-width="3" stroke-linecap="round"/>
        <line x1="44" y1="0" x2="56" y2="0" stroke="#E8B79A" stroke-width="3" stroke-linecap="round"/>
        <line x1="31" y1="31" x2="40" y2="40" stroke="#E8B79A" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="44" x2="0" y2="56" stroke="#E8B79A" stroke-width="3" stroke-linecap="round"/>
        <line x1="-31" y1="31" x2="-40" y2="40" stroke="#E8B79A" stroke-width="3" stroke-linecap="round"/>
        <line x1="-44" y1="0" x2="-56" y2="0" stroke="#E8B79A" stroke-width="3" stroke-linecap="round"/>
        <line x1="-31" y1="-31" x2="-40" y2="-40" stroke="#E8B79A" stroke-width="3" stroke-linecap="round"/>
        <text x="0" y="7" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" text-anchor="middle">PR</text>
      </g>

      <text x="230" y="210" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700" text-anchor="middle">PR SPARKZ</text>
      <text x="230" y="245" fill="#E8B79A" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="26" text-anchor="middle">Igniting Brand Authority</text>

      <rect x="50" y="280" width="360" height="150" rx="8" fill="#38180A"/>
      <text x="70" y="315" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">TIER-1 MEDIA PLACEMENT</text>
      <text x="70" y="345" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Forbes, Bloomberg &amp; TechCrunch</text>
      <text x="70" y="375" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.75">
        Targeted press releases and thought leadership profiling for founders.
      </text>
      <text x="70" y="410" fill="#E8B79A" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">850M+ Organic Media Impressions</text>
    </g>

    <!-- Services Column -->
    <g transform="translate(530, 80)">
      <rect x="0" y="0" width="350" height="480" rx="12" fill="#F7F1DF" stroke="#532510" stroke-width="1" stroke-opacity="0.15"/>
      <text x="24" y="38" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Strategic PR Solutions</text>
      
      <rect x="24" y="60" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="90" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Founder Thought Leadership</text>
      <text x="40" y="110" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Op-eds, keynotes &amp; podcast tours</text>
      <text x="40" y="130" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Reputation Management</text>

      <rect x="24" y="160" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="190" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Crisis Communications</text>
      <text x="40" y="210" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Rapid response playbooks &amp; media prep</text>
      <text x="40" y="230" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">24/7 War Room Protocol</text>

      <rect x="24" y="260" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="290" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Digital Growth Marketing</text>
      <text x="40" y="310" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Omnichannel campaigns &amp; influencer alignment</text>
      <text x="40" y="330" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">High-ROI Client Acquisition</text>

      <rect x="24" y="370" width="302" height="50" rx="25" fill="#C46F39"/>
      <text x="175" y="401" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Schedule Media Briefing →</text>
