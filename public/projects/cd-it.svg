<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cdit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF9EF"/>
      <stop offset="100%" stop-color="#F7F1DF"/>
    </linearGradient>
    <filter id="cdit-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#532510" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#cdit-bg)"/>

  <g transform="translate(140, 100)" filter="url(#cdit-sh)">
    <rect x="0" y="0" width="920" height="600" rx="16" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="920" height="46" rx="16" fill="#532510"/>
    <rect x="0" y="30" width="920" height="16" fill="#532510"/>
    <circle cx="28" cy="23" r="5" fill="#E8B79A"/>
    <circle cx="44" cy="23" r="5" fill="#C46F39"/>
    <circle cx="60" cy="23" r="5" fill="#FDF9EF" opacity="0.6"/>
    <text x="460" y="28" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2" text-anchor="middle">CD-IT-TEN.VERCEL.APP // ENTERPRISE IT &amp; CLOUD INFRASTRUCTURE</text>

    <!-- Cloud Server Architecture Display -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="460" height="480" rx="12" fill="#532510"/>
      <!-- Server Rack Geometry -->
      <g transform="translate(50, 45)">
        <rect x="0" y="0" width="360" height="60" rx="8" fill="#38180A" stroke="#C46F39" stroke-width="1"/>
        <circle cx="30" cy="30" r="5" fill="#C46F39"/>
        <line x1="50" y1="30" x2="330" y2="30" stroke="#E8B79A" stroke-width="2" stroke-dasharray="8 6"/>

        <rect x="0" y="75" width="360" height="60" rx="8" fill="#38180A" stroke="#C46F39" stroke-width="1"/>
        <circle cx="30" cy="105" r="5" fill="#C46F39"/>
        <line x1="50" y1="105" x2="330" y2="105" stroke="#E8B79A" stroke-width="2" stroke-dasharray="8 6"/>

        <rect x="0" y="150" width="360" height="60" rx="8" fill="#38180A" stroke="#C46F39" stroke-width="1"/>
        <circle cx="30" cy="180" r="5" fill="#C46F39"/>
        <line x1="50" y1="180" x2="330" y2="180" stroke="#E8B79A" stroke-width="2" stroke-dasharray="8 6"/>
      </g>

      <text x="50" y="320" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">CD IT SOLUTIONS</text>
      <text x="50" y="355" fill="#E8B79A" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="24">Mission-Critical Enterprise Cloud</text>
      <text x="50" y="390" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.8">
        Architecting hybrid cloud migrations, zero-trust security &amp; DevOps pipelines.
      </text>

      <rect x="50" y="420" width="180" height="30" rx="15" fill="#C46F39"/>
      <text x="140" y="439" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Consult IT Architects →</text>
    </g>

    <!-- IT Capabilities Column -->
    <g transform="translate(530, 80)">
      <rect x="0" y="0" width="350" height="480" rx="12" fill="#F7F1DF" stroke="#532510" stroke-width="1" stroke-opacity="0.15"/>
      <text x="24" y="38" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Infrastructure Capabilities</text>
      
      <rect x="24" y="60" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="90" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">AWS / Azure / GCP Cloud Stacks</text>
      <text x="40" y="110" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Kubernetes orchestration &amp; multi-region failover</text>
      <text x="40" y="130" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">99.999% High Availability SLA</text>

      <rect x="24" y="160" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="190" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Zero-Trust Cybersecurity Audits</text>
      <text x="40" y="210" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">SOC2, ISO27001 &amp; HIPAA compliant enforcement</text>
      <text x="40" y="230" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Continuous Threat Monitoring</text>

      <rect x="24" y="260" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="290" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Enterprise AI &amp; Database Sync</text>
      <text x="40" y="310" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Automated ETL pipelines &amp; real-time telemetry</text>
      <text x="40" y="330" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Low-Latency Data Lakes</text>

      <rect x="24" y="370" width="302" height="50" rx="25" fill="#532510"/>
      <text x="175" y="401" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Schedule Cloud Assessment →</text>
    </g>
  </g>
</svg>

