<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cdh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF9EF"/>
      <stop offset="100%" stop-color="#F7F1DF"/>
    </linearGradient>
    <filter id="cdh-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#532510" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#cdh-bg)"/>

  <g transform="translate(140, 100)" filter="url(#cdh-sh)">
    <rect x="0" y="0" width="920" height="600" rx="16" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="920" height="46" rx="16" fill="#532510"/>
    <rect x="0" y="30" width="920" height="16" fill="#532510"/>
    <circle cx="28" cy="23" r="5" fill="#E8B79A"/>
    <circle cx="44" cy="23" r="5" fill="#C46F39"/>
    <circle cx="60" cy="23" r="5" fill="#FDF9EF" opacity="0.6"/>
    <text x="460" y="28" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2" text-anchor="middle">CD-HYDRO.VERCEL.APP // HYDROELECTRIC &amp; GREEN HYDROGEN</text>

    <!-- Hydro Engineering Blueprint Display -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="460" height="480" rx="12" fill="#532510"/>
      <!-- Hydro Turbine & Waveform Geometry -->
      <g transform="translate(230, 150)">
        <circle cx="0" cy="0" r="70" fill="none" stroke="#C46F39" stroke-width="2"/>
        <circle cx="0" cy="0" r="50" fill="none" stroke="#E8B79A" stroke-width="1.5" stroke-dasharray="4 4"/>
        <circle cx="0" cy="0" r="25" fill="#C46F39"/>
        <!-- Turbine Blades -->
        <path d="M 0 -25 C 20 -40, 40 -30, 45 -10" fill="none" stroke="#FDF9EF" stroke-width="3"/>
        <path d="M 25 0 C 40 20, 30 40, 10 45" fill="none" stroke="#FDF9EF" stroke-width="3"/>
        <path d="M 0 25 C -20 40, -40 30, -45 10" fill="none" stroke="#FDF9EF" stroke-width="3"/>
        <path d="M -25 0 C -40 -20, -30 -40, -10 -45" fill="none" stroke="#FDF9EF" stroke-width="3"/>
      </g>

      <!-- Water Flow Waves -->
      <path d="M 50 260 Q 140 240, 230 260 T 410 260" fill="none" stroke="#E8B79A" stroke-width="2"/>
      <path d="M 50 280 Q 140 260, 230 280 T 410 280" fill="none" stroke="#C46F39" stroke-width="2"/>

      <text x="50" y="340" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">CD HYDRO</text>
      <text x="50" y="375" fill="#E8B79A" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="24">Renewable Power Infrastructure</text>
      <text x="50" y="410" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.8">
        Clean hydrogen synthesis &amp; megawatt-scale hydroelectric engineering.
      </text>

      <rect x="50" y="435" width="220" height="26" rx="13" fill="#38180A"/>
      <text x="160" y="452" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ZERO-EMISSION CLEAN TECH</text>
    </g>

    <!-- Engineering Specs & Metrics -->
    <g transform="translate(530, 80)">
      <rect x="0" y="0" width="350" height="480" rx="12" fill="#F7F1DF" stroke="#532510" stroke-width="1" stroke-opacity="0.15"/>
      <text x="24" y="38" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Engineering Solutions</text>
      
      <rect x="24" y="60" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="90" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Green Hydrogen Electrolyzers</text>
      <text x="40" y="110" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">PEM &amp; Alkaline high-efficiency stacks</text>
      <text x="40" y="130" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">99.999% Pure H2 Output</text>

      <rect x="24" y="160" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="190" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Hydroelectric Turbine Turbines</text>
      <text x="40" y="210" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Francis, Kaplan &amp; Pelton designs</text>
      <text x="40" y="230" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Up to 250MW Installation Capacity</text>

      <rect x="24" y="260" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="290" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Telemetry &amp; SCADA Cloud</text>
      <text x="40" y="310" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Real-time plant monitoring and AI grid sync</text>
      <text x="40" y="330" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Automated Fault Prevention</text>

      <rect x="24" y="370" width="302" height="50" rx="25" fill="#532510"/>
      <text x="175" y="401" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Explore Industrial Energy Specs →</text>
    </g>
  </g>
</svg>

