<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="vk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF9EF"/>
      <stop offset="100%" stop-color="#F7F1DF"/>
    </linearGradient>
    <filter id="vk-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#532510" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#vk-bg)"/>

  <g transform="translate(140, 100)" filter="url(#vk-sh)">
    <rect x="0" y="0" width="920" height="600" rx="16" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <!-- Top Bar -->
    <rect x="0" y="0" width="920" height="46" rx="16" fill="#532510"/>
    <rect x="0" y="30" width="920" height="16" fill="#532510"/>
    <circle cx="28" cy="23" r="5" fill="#E8B79A"/>
    <circle cx="44" cy="23" r="5" fill="#C46F39"/>
    <circle cx="60" cy="23" r="5" fill="#FDF9EF" opacity="0.6"/>
    <text x="460" y="28" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2" text-anchor="middle">VIBHUKITCHEN.IN // COMMERCIAL CULINARY EQUIPMENT</text>

    <!-- Culinary Hardware Layout -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="460" height="480" rx="12" fill="#532510"/>
      <!-- Stainless Steel Oven / Range Geometry -->
      <rect x="50" y="50" width="360" height="260" rx="8" fill="#38180A" stroke="#C46F39" stroke-width="1.5"/>
      <rect x="70" y="70" width="320" height="130" rx="6" fill="#532510"/>
      
      <!-- Knobs / Dials -->
      <circle cx="110" cy="250" r="16" fill="#C46F39"/>
      <circle cx="180" cy="250" r="16" fill="#C46F39"/>
      <circle cx="250" cy="250" r="16" fill="#C46F39"/>
      <circle cx="320" cy="250" r="16" fill="#C46F39"/>

      <!-- Flame Motif -->
      <g transform="translate(230, 135) scale(1.2)">
        <path d="M 0 20 Q 15 -10, 0 -35 Q -15 -10, 0 20 Z" fill="#C46F39"/>
        <path d="M 0 15 Q 8 -5, 0 -22 Q -8 -5, 0 15 Z" fill="#E8B79A"/>
      </g>

      <text x="50" y="360" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">VIBHU KITCHEN</text>
      <text x="50" y="395" fill="#E8B79A" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="24">Precision Hospitality Hardware</text>
      <text x="50" y="430" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.8">
        Supplying 5-star hotels, luxury cloud kitchens &amp; restaurant chains.
      </text>
    </g>

    <!-- Product Spec Sheet -->
    <g transform="translate(530, 80)">
      <rect x="0" y="0" width="350" height="480" rx="12" fill="#F7F1DF" stroke="#532510" stroke-width="1" stroke-opacity="0.15"/>
      <text x="24" y="38" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Equipment Catalog</text>
      
      <rect x="24" y="60" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="90" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Industrial Induction Ranges</text>
      <text x="40" y="110" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Heavy-Duty 304 Stainless Steel</text>
      <text x="40" y="130" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Custom Fabrication Available</text>

      <rect x="24" y="160" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="190" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Commercial Refrigeration Systems</text>
      <text x="40" y="210" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Dual Temp Blast Chillers &amp; Freezers</text>
      <text x="40" y="230" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Energy Star Certified</text>

      <rect x="24" y="260" width="302" height="85" rx="8" fill="#FDF9EF"/>
      <text x="40" y="290" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Bakery &amp; Confectionery Units</text>
      <text x="40" y="310" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="11" opacity="0.7">Rotary Rack Ovens &amp; Provers</text>
      <text x="40" y="330" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">High Capacity Automation</text>

      <rect x="24" y="370" width="302" height="50" rx="25" fill="#532510"/>
      <text x="175" y="401" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Request Commercial Catalog →</text>
    </g>
  </g>
</svg>

