<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="at-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF9EF"/>
      <stop offset="60%" stop-color="#F7F1DF"/>
      <stop offset="100%" stop-color="#E8DEC8"/>
    </linearGradient>
    <linearGradient id="at-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#532510"/>
      <stop offset="100%" stop-color="#38180A"/>
    </linearGradient>
    <linearGradient id="at-terracotta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C46F39"/>
      <stop offset="100%" stop-color="#D98652"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#532510" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#at-bg)"/>

  <!-- Architectural Grid Lines -->
  <line x1="80" y1="0" x2="80" y2="800" stroke="#532510" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="1120" y1="0" x2="1120" y2="800" stroke="#532510" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#532510" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="720" x2="1200" y2="720" stroke="#532510" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Main Editorial Browser / Frame -->
  <g filter="url(#shadow)">
    <rect x="120" y="100" width="960" height="600" rx="16" fill="#FDF9EF" stroke="#532510" stroke-width="2"/>
    
    <!-- Browser Top Bar -->
    <rect x="120" y="100" width="960" height="44" rx="16" fill="#532510"/>
    <rect x="120" y="130" width="960" height="14" fill="#532510"/>
    <circle cx="150" cy="122" r="5" fill="#E8B79A"/>
    <circle cx="166" cy="122" r="5" fill="#C46F39"/>
    <circle cx="182" cy="122" r="5" fill="#FDF9EF" opacity="0.6"/>
    <text x="600" y="127" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2" text-anchor="middle" opacity="0.8">ATELIERHOUSE.DESIGN — MILAN / PARIS</text>
    
    <!-- Editorial Layout Inside Browser -->
    <rect x="150" y="174" width="420" height="496" rx="8" fill="#F7F1DF"/>
    <!-- Large Architectural Arch -->
    <path d="M 230 670 V 350 A 130 130 0 0 1 490 350 V 670 Z" fill="url(#at-wood)"/>
    <path d="M 270 670 V 390 A 90 90 0 0 1 450 390 V 670 Z" fill="#E8B79A" opacity="0.25"/>
    <circle cx="360" cy="380" r="40" fill="#C46F39" opacity="0.8"/>
    <line x1="360" y1="280" x2="360" y2="670" stroke="#FDF9EF" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
    
    <!-- Content Column on Right -->
    <text x="620" y="240" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" letter-spacing="3">01 // RESIDENTIAL ARCHITECTURE</text>
    <text x="620" y="300" fill="#532510" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="52" font-weight="400">Palazzo Serbelloni</text>
    <text x="620" y="350" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="16" opacity="0.75" width="400">
      Harmonizing neoclassical structural restoration with contemporary warm minimalism.
    </text>

    <!-- Mini Spec Grid -->
    <rect x="620" y="390" width="420" height="1" fill="#532510" opacity="0.15"/>
    <text x="620" y="420" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.5">LOCATION</text>
    <text x="620" y="440" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600">Corso Venezia, Milano</text>
    
    <text x="820" y="420" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.5">TIMELINE</text>
    <text x="820" y="440" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600">18 Months // Completed</text>
    <rect x="620" y="470" width="420" height="1" fill="#532510" opacity="0.15"/>

    <!-- Interactive Button in Preview -->
    <rect x="620" y="520" width="200" height="50" rx="25" fill="#532510"/>
    <text x="720" y="551" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="500" text-anchor="middle">View Full Monograph →</text>

    <rect x="840" y="520" width="180" height="50" rx="25" fill="none" stroke="#C46F39" stroke-width="1.5"/>
    <text x="930" y="551" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="500" text-anchor="middle">Material Samples</text>

    <!-- Small Sunburst Ray Motif -->
    <g transform="translate(1010, 210) scale(0.6)">
      <line x1="0" y1="-25" x2="0" y2="-40" stroke="#C46F39" stroke-width="3" stroke-linecap="round"/>
      <line x1="18" y1="-18" x2="28" y2="-28" stroke="#C46F39" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="0" x2="40" y2="0" stroke="#C46F39" stroke-width="3" stroke-linecap="round"/>
      <line x1="18" y1="18" x2="28" y2="28" stroke="#C46F39" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="25" x2="0" y2="40" stroke="#C46F39" stroke-width="3" stroke-linecap="round"/>
      <line x1="-18" y1="18" x2="-28" y2="28" stroke="#C46F39" stroke-width="3" stroke-linecap="round"/>
      <line x1="-25" y1="0" x2="-40" y2="0" stroke="#C46F39" stroke-width="3" stroke-linecap="round"/>
      <line x1="-18" y1="-18" x2="-28" y2="-28" stroke="#C46F39" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Editorial Floating Badge -->
  <g transform="translate(970, 620) rotate(-6)">
    <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#C46F39" stroke="#FDF9EF" stroke-width="2"/>
    <text x="0" y="6" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">CONCEPT // 01</text>
  </g>
</svg>

