<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="sr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F1DF"/>
      <stop offset="50%" stop-color="#FDF9EF"/>
      <stop offset="100%" stop-color="#E8B79A" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="sr-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="20" stdDeviation="20" flood-color="#532510" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sr-bg)"/>

  <!-- Subtle Circular Stamp in background -->
  <circle cx="600" cy="400" r="320" fill="none" stroke="#C46F39" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Left: Luxury Packaging Box in isometric/angle perspective -->
  <g transform="translate(240, 220)" filter="url(#sr-shadow)">
    <!-- Box Front Face -->
    <rect x="0" y="0" width="300" height="420" rx="12" fill="#532510"/>
    <!-- Embossed Gold / Terracotta Foil Frame -->
    <rect x="18" y="18" width="264" height="384" rx="8" fill="none" stroke="#C46F39" stroke-width="1.5"/>
    
    <!-- Brand Seal / Sunburst -->
    <circle cx="150" cy="110" r="38" fill="none" stroke="#E8B79A" stroke-width="1.5"/>
    <g transform="translate(150, 110)">
      <line x1="0" y1="-18" x2="0" y2="-28" stroke="#C46F39" stroke-width="2"/>
      <line x1="13" y1="-13" x2="20" y2="-20" stroke="#C46F39" stroke-width="2"/>
      <line x1="18" y1="0" x2="28" y2="0" stroke="#C46F39" stroke-width="2"/>
      <line x1="13" y1="13" x2="20" y2="20" stroke="#C46F39" stroke-width="2"/>
      <line x1="0" y1="18" x2="0" y2="28" stroke="#C46F39" stroke-width="2"/>
      <line x1="-13" y1="13" x2="-20" y2="20" stroke="#C46F39" stroke-width="2"/>
      <line x1="-18" y1="0" x2="-28" y2="0" stroke="#C46F39" stroke-width="2"/>
      <line x1="-13" y1="-13" x2="-20" y2="-20" stroke="#C46F39" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#C46F39"/>
    </g>

    <!-- Typography on Packaging -->
    <text x="150" y="195" fill="#FDF9EF" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="34" text-anchor="middle">Sunday Ritual</text>
    <text x="150" y="225" fill="#E8B79A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="4" text-anchor="middle">ORGANIC BOTANICAL OIL</text>

    <!-- Botanical Line Art -->
    <path d="M 150 320 C 150 260, 110 270, 120 240 C 130 255, 145 270, 150 280 C 155 270, 170 255, 180 240 C 190 270, 150 260, 150 320 Z" fill="#C46F39" opacity="0.6"/>
    <line x1="150" y1="230" x2="150" y2="340" stroke="#E8B79A" stroke-width="1.5"/>

    <text x="150" y="375" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="10" opacity="0.6" letter-spacing="2" text-anchor="middle">NO. 04 // 100ML 3.4 FL OZ</text>
  </g>

  <!-- Right: Identity Stationery & Cards System -->
  <g transform="translate(620, 160)" filter="url(#sr-shadow)">
    <!-- Main Stationery Sheet -->
    <rect x="0" y="0" width="380" height="480" rx="8" fill="#FDF9EF" stroke="#532510" stroke-width="1"/>
    
    <!-- Top Brand Header -->
    <text x="40" y="60" fill="#532510" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="32">Sunday Ritual</text>
    <text x="340" y="58" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="2" text-anchor="end">EST. 2024</text>
    <line x1="40" y1="80" x2="340" y2="80" stroke="#532510" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Specimen lines -->
    <text x="40" y="130" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Visual Identity System</text>
    <text x="40" y="160" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.7">Palette: Terracotta Sun, Espresso Soil, Warm Ivory</text>
    
    <!-- Swatch palette circles -->
    <circle cx="55" cy="200" r="15" fill="#532510"/>
    <circle cx="95" cy="200" r="15" fill="#C46F39"/>
    <circle cx="135" cy="200" r="15" fill="#E8B79A"/>
    <circle cx="175" cy="200" r="15" fill="#FDF9EF" stroke="#532510" stroke-width="1"/>

    <!-- Typographic Specimen -->
    <rect x="40" y="240" width="300" height="90" rx="6" fill="#F7F1DF"/>
    <text x="56" y="270" fill="#532510" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="22">Aa Bb Cc Dd Ee Ff Gg</text>
    <text x="56" y="300" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.6">Space Grotesk + Instrument Serif</text>

    <!-- Stamp in corner -->
    <g transform="translate(290, 400)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#C46F39" stroke-width="1.5"/>
      <text x="0" y="4" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">VERIFIED</text>
    </g>
  </g>

  <!-- Floating Concept Pill -->
  <g transform="translate(680, 680)">
    <rect x="-80" y="-20" width="160" height="40" rx="20" fill="#C46F39"/>
    <text x="0" y="5" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">BRANDING // 02</text>
  </g>
</svg>

