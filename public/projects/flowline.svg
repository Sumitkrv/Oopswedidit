<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="fl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF9EF"/>
      <stop offset="100%" stop-color="#F7F1DF"/>
    </linearGradient>
    <filter id="fl-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#532510" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#fl-bg)"/>

  <!-- Node Pipeline Canvas -->
  <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1.5" fill="#532510" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="800" fill="url(#dot-grid)"/>

  <!-- Connecting Curved Bezier Pipelines -->
  <path d="M 280 250 C 380 250, 420 380, 520 380" fill="none" stroke="#C46F39" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M 280 520 C 380 520, 420 400, 520 400" fill="none" stroke="#C46F39" stroke-width="3"/>
  <path d="M 760 390 C 840 390, 860 270, 940 270" fill="none" stroke="#532510" stroke-width="3"/>
  <path d="M 760 410 C 840 410, 860 530, 940 530" fill="none" stroke="#532510" stroke-width="3"/>

  <!-- Node 1: Inbound Lead Trigger (Top Left) -->
  <g transform="translate(100, 200)" filter="url(#fl-shadow)">
    <rect x="0" y="0" width="220" height="100" rx="12" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="30" rx="12" fill="#532510"/>
    <rect x="0" y="16" width="220" height="14" fill="#532510"/>
    <text x="16" y="20" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1">TRIGGER // 01</text>
    <text x="16" y="58" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Inbound Inquiry</text>
    <text x="16" y="80" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="12">Next.js Webhook Active</text>
    <circle cx="220" cy="50" r="7" fill="#C46F39"/>
  </g>

  <!-- Node 2: Meeting Calendar Booking (Bottom Left) -->
  <g transform="translate(100, 470)" filter="url(#fl-shadow)">
    <rect x="0" y="0" width="220" height="100" rx="12" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="30" rx="12" fill="#532510"/>
    <rect x="0" y="16" width="220" height="14" fill="#532510"/>
    <text x="16" y="20" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1">TRIGGER // 02</text>
    <text x="16" y="58" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Calendar Scheduled</text>
    <text x="16" y="80" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="12">Timezone Synced</text>
    <circle cx="220" cy="50" r="7" fill="#C46F39"/>
  </g>

  <!-- Center Node: AI Enrichment & Scoring Hub (Center) -->
  <g transform="translate(480, 290)" filter="url(#fl-shadow)">
    <rect x="0" y="0" width="300" height="220" rx="16" fill="#532510"/>
    <rect x="12" y="12" width="276" height="196" rx="12" fill="none" stroke="#C46F39" stroke-width="1.5"/>

    <!-- Central Brain Icon / Rays -->
    <g transform="translate(150, 70)">
      <circle cx="0" cy="0" r="24" fill="#C46F39"/>
      <circle cx="0" cy="0" r="10" fill="#FDF9EF"/>
      <!-- Radiating accents -->
      <line x1="0" y1="-32" x2="0" y2="-44" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="22" y1="-22" x2="32" y2="-32" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="32" y1="0" x2="44" y2="0" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="32" y2="32" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-22" y1="22" x2="-32" y2="32" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-32" y1="0" x2="-44" y2="0" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-22" y1="-22" x2="-32" y2="-32" stroke="#E8B79A" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="150" y="135" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" text-anchor="middle">AI Deal Synthesis</text>
    <text x="150" y="160" fill="#E8B79A" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.8" text-anchor="middle">Enriches company &amp; qualifies scope</text>
    
    <rect x="50" y="174" width="200" height="24" rx="12" fill="#38180A"/>
    <text x="150" y="190" fill="#C46F39" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">LATENCY: 420ms // ACCURACY 99.4%</text>

    <!-- Node Connectors -->
    <circle cx="0" cy="110" r="7" fill="#C46F39"/>
    <circle cx="300" cy="100" r="7" fill="#C46F39"/>
    <circle cx="300" cy="120" r="7" fill="#C46F39"/>
  </g>

  <!-- Node 3: CRM Deal & Slack Notification (Top Right) -->
  <g transform="translate(900, 220)" filter="url(#fl-shadow)">
    <rect x="0" y="0" width="220" height="100" rx="12" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="30" rx="12" fill="#C46F39"/>
    <rect x="0" y="16" width="220" height="14" fill="#C46F39"/>
    <text x="16" y="20" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1">ACTION // 01</text>
    <text x="16" y="58" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">HubSpot Deal Stage</text>
    <text x="16" y="80" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.7">VIP Route Assigned</text>
    <circle cx="0" cy="50" r="7" fill="#532510"/>
  </g>

  <!-- Node 4: Auto-Generated Project Brief (Bottom Right) -->
  <g transform="translate(900, 480)" filter="url(#fl-shadow)">
    <rect x="0" y="0" width="220" height="100" rx="12" fill="#FDF9EF" stroke="#532510" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="30" rx="12" fill="#C46F39"/>
    <rect x="0" y="16" width="220" height="14" fill="#C46F39"/>
    <text x="16" y="20" fill="#FDF9EF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1">ACTION // 02</text>
    <text x="16" y="58" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Draft Project Brief</text>
    <text x="16" y="80" fill="#532510" font-family="'Space Grotesk', sans-serif" font-size="12" opacity="0.7">Notion &amp; Slack Dispatched</text>
    <circle cx="0" cy="50" r="7" fill="#532510"/>
  </g>
</svg>

